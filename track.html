<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order — MHC Diecast</title>
  <meta name="theme-color" content="#F5F5F7">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://mmaoniudyamdyfzrxjxt.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>try{var t=localStorage.getItem('mhc-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div id="siteHeader"></div>

<main class="container narrow">
  <h1 class="page-title">Track your order</h1>
  <form id="trackForm" class="panel" novalidate>
    <div class="two">
      <div class="field"><label for="code">Order code</label>
        <input class="input" id="code" placeholder="MHC-XXXXXX" autocapitalize="characters" required></div>
      <div class="field"><label for="phone">Mobile number</label>
        <input class="input" id="phone" type="tel" inputmode="numeric" maxlength="10" required></div>
    </div>
    <p class="form-error" id="trackError" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="trackBtn">Check status</button>
  </form>

  <section id="result"></section>
  <section id="recent"></section>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/track.js"></script>
</body>
</html>
