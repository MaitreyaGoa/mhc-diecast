<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your cart — MHC Diecast</title>
  <meta name="theme-color" content="#F5F5F7">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://mmaoniudyamdyfzrxjxt.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>try{var t=localStorage.getItem('mhc-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div id="siteHeader"></div>

<main class="container">
  <h1 class="page-title">Your cart</h1>
  <div id="notes"></div>
  <div class="cart-layout">
    <section id="cartItems" class="panel"><p class="empty">Loading…</p></section>
    <aside class="panel summary" id="summary" hidden>
      <div class="sum-row"><span>Subtotal</span><b id="subtotal">₹0</b></div>
      <div class="sum-row muted"><span>Shipping</span><span>Free in Goa · <span id="outsideRate"></span> outside Goa</span></div>
      <p class="small muted">Final shipping is calculated from your pincode at checkout.</p>
      <p class="small notice" id="multiNote" hidden>Your cart has cars from more than one seller. You'll pay each seller separately at checkout — one UPI payment each.</p>
      <a href="checkout.html" class="btn btn-primary btn-block" id="checkoutBtn">Proceed to checkout</a>
      <a href="index.html" class="btn btn-ghost btn-block">Continue shopping</a>
    </aside>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cart-page.js"></script>
</body>
</html>
