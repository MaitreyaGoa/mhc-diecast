<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — MHC Diecast</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #15171C; background: #FAFAF7; }
    .road { width: 260px; height: 10px; border-radius: 6px; margin: 18px auto;
      background: repeating-linear-gradient(90deg, #FF7A00 0 28px, #FF9A3D 28px 32px); }
    h1 { font-style: italic; font-weight: 900; font-size: 64px; margin: 0; text-transform: uppercase;
      background: linear-gradient(90deg, #E4202E, #FF6A13 55%, #FFC72C); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #646B78; font-size: 17px; }
    a { display: inline-block; margin-top: 10px; padding: 12px 22px; border-radius: 12px; background: #FF6A13; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <div style="font-size:56px">🏎️💨</div>
    <h1>Off track!</h1>
    <div class="road"></div>
    <p>This page doesn't exist — the car may have sold or the link is wrong.</p>
    <a id="home" href="/">Back to the shop</a>
  </div>
  <script>
    // On github.io project sites the shop lives under /<repo>/
    if (location.hostname.endsWith('github.io')) {
      const repo = location.pathname.split('/')[1];
      if (repo) document.getElementById('home').href = '/' + repo + '/';
    }
  </script>
</body>
</html>
