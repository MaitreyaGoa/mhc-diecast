<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MHC Diecast — Hot Wheels & Diecast Cars in Goa</title>
  <meta name="description" content="Buy Hot Wheels and 1:64 diecast cars in Goa. Free shipping across Goa, delivery across India.">
  <meta name="theme-color" content="#FF6A13">
  <meta property="og:title" content="MHC Diecast — Hot Wheels & Diecast Cars in Goa">
  <meta property="og:description" content="Free shipping across Goa · Pan-India delivery · Pay by UPI">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div id="siteHeader"></div>

<main class="container">
  <section class="hero">
    <h1>Fresh off the <span class="accent">track</span></h1>
    <p>Hot Wheels mainlines, premiums and 1:64 diecasts — handpicked and shipped from Goa.</p>
    <div class="badges">
      <span class="badge goa">🏝️ Free shipping across Goa</span>
      <span class="badge">🚚 Pan-India delivery</span>
      <span class="badge">✅ Pay by UPI</span>
    </div>
  </section>

  <div class="track" aria-hidden="true"></div>

  <div class="toolbar">
    <div class="chips" id="brandChips"><button class="chip active" data-brand="">All</button></div>
    <label class="sr-only" for="search">Search cars</label>
    <input class="search" id="search" type="search" placeholder="Search cars…">
    <label class="sr-only" for="sort">Sort</label>
    <select class="search sort" id="sort">
      <option value="new">Newest</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
    </select>
  </div>

  <section class="grid" id="productGrid" aria-live="polite"></section>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
