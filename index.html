<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MHC Diecast — Hot Wheels & Diecast Cars in Goa</title>
  <meta name="description" content="Buy Hot Wheels and 1:64 diecast cars in Goa. Free shipping across Goa, delivery across India.">
  <meta name="theme-color" content="#F5F5F7">
  <meta property="og:title" content="MHC Diecast — Hot Wheels & Diecast Cars in Goa">
  <meta property="og:image" content="https://www.mhcdiecast.com/assets/img/icon-512.png">
  <meta property="og:url" content="https://www.mhcdiecast.com/">
  <meta property="og:description" content="Free shipping across Goa · Pan-India delivery · Pay by UPI">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://mmaoniudyamdyfzrxjxt.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<div id="siteHeader"></div>

<main class="container">
  <section class="hero">
    <div class="hero-copy">
      <h1>Collector diecast, shipped from Goa.</h1>
      <p>Hot Wheels, Mini GT and Matchbox in 1:64 — picked one by one, packed like they're ours. Free delivery anywhere in Goa.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#shop">Browse cars</a>
        <a class="btn btn-ghost" id="heroGroup" target="_blank" rel="noopener" hidden>Join the WhatsApp group</a>
      </div>
      <div class="badges">
        <span class="badge goa">Free shipping across Goa</span>
        <span class="badge">Delivery across India</span>
        <span class="badge">Pay by UPI</span>
      </div>
    </div>
    <a class="stage intro" id="stage" href="#shop" aria-label="Newest car">
      <div class="stage-floor-shadow" aria-hidden="true"></div>
      <div class="stage-reflection" aria-hidden="true"><img id="stageReflect" alt=""></div>
      <div class="stage-object"><img id="stageImg" data-logo src="assets/img/logo-192.png" alt="MHC Diecast"></div>
      <div class="stage-caption" id="stageCaption" hidden></div>
    </a>
  </section>

  <div class="section-head" id="shop"><h2 id="shopHeading">In the case now</h2></div>

  <nav class="chips menu-chips" id="brandChips" aria-label="Shop by brand"></nav>
  <div class="toolbar">
    <div class="chips sub-chips" id="typeChips" hidden></div>
    <label class="sr-only" for="search">Search cars</label>
    <input class="search" id="search" type="search" placeholder="Search cars…">
    <label class="sr-only" for="sort">Sort</label>
    <label class="sr-only" for="scale">Scale</label>
    <select class="search sort" id="scale" hidden></select>
    <select class="search sort" id="sort">
      <option value="new">Newest</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
    </select>
  </div>

  <section class="grid" id="productGrid" aria-live="polite"></section>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
